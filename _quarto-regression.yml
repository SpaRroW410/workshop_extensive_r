# ═══════════════════════════════════════════════════════════════
# _quarto-regression.yml  — REGRESSION PROFILE
# Render with:  quarto render --profile regression
# Output goes to:  docs/regression/
# ═══════════════════════════════════════════════════════════════

project:
  output-dir: docs/regression
  # Theory of Regression Analysis workshop (6 reveal.js decks + cheat sheet).
  # Added here (not in _quarto.yml) so only the regression track renders them.
  render:
    - "regression-workshop/*.qmd"
    - "regression-quest/*.qmd"
  # Student-facing files only — facilitator solutions are deliberately NOT listed.
  resources:
    - data/ncd_survey.csv
    - regression-workshop/make_data.R
    - regression-workshop/labs/*.R
    - regression-quest/assets/*

website:
  title: "Data Visualization Workshop — Regression"
  site-url: "."
  search: true

  navbar:
    logo-href: welcome.html
    left:
      - text: "R Foundations"
        menu:
          - text: "Getting Started"
            href: r-foundations/getting-started.qmd
          - text: "Data Wrangling (Tidyverse)"
            href: r-foundations/data-wrangling.qmd
      - text: "Regression Analysis"
        href: statistical-analysis/regression.qmd
      - text: "Regression Quest"
        menu:
