# ═══════════════════════════════════════════════════════════════
# _quarto.yml  — BASE / SHARED SETTINGS
# ---------------------------------------------------------------
# DO NOT put output-dir or website: here.
# Each profile YAML (_quarto-basic.yml, etc.) controls its own
# output-dir and navbar.  Quarto merges this file + the active
# profile YAML at render time.
# ═══════════════════════════════════════════════════════════════

project:
  type: website
  resources:
    - "!docs/**"
    - "!_site/**"
    - config.json
    - navigation.json
    - navigation.yml
    - assets/
  render:
    - "!docs/**"
    - "!_site/**"
    - "index.qmd"
    - "welcome.qmd"
    - "contact.qmd"
    - "downloads.qmd"
    - "references.qmd"
    - "r-foundations/*.qmd"
    - "data-visualization/*.qmd"
    - "data-visualization/gram_ggplot/*.qmd"
    - "plot-gallery/*.qmd"
    - "specialized/*.qmd"
    - "statistical-analysis/*.qmd"
    - "exporting_tools/*.qmd"
    - "nctoh/*.qmd"

format:
  html:
    theme: flatly
    css: assets/theme_webp.css
    code-copy: true
    toc: true
    lightbox: auto
    include-in-header:
      text: |
        <script src="assets/fitty-init.js"></script>
