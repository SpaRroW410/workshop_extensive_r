name: deploy
# Publish docs/ to Cloudflare Pages. Runs ONLY when started by hand (Actions tab > deploy > Run workflow):
# a push never deploys anything (LAUNCH_PLAN.md §1). The site is not built here; docs/ is used as committed.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "production or preview"
        required: true
        default: preview
        type: choice
        options: [preview, production]
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: cloud
        run: npm ci
      - name: Tests
        working-directory: cloud
        run: npm test
      - name: Deploy
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash deploy.sh ${{ inputs.target == 'preview' && '--preview' || '' }}
